[platformio]
default_envs = waveshare_esp32_s3_touch_amoled_2_06

[env:waveshare_esp32_s3_touch_amoled_2_06]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_build.partitions = partitions.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
# Linked into the app image; watch_audio.c reads it through _binary_gong_wav_start.
board_build.embed_files = assets/gong.wav
extra_scripts = post:embed_assets.py
monitor_speed = 115200
